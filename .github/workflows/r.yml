name: R analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  r-script:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v5
    - name: Set up R
      uses: r-lib/actions/setup-r@v2
      with:
        r-version: release
    - name: Run the R rebuild and Python cross-check
      run: Rscript R/segmentation_and_churn.R
    - name: Upload R outputs
      uses: actions/upload-artifact@v4
      with:
        name: r-outputs
        path: outputs/r/
